name: Windows package

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/beta/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build, test, and validate Windows installers
        run: npm run package:windows

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: pos-nativo-windows
          path: |
            apps/beta/src-tauri/target/release/bundle/msi/*.msi
            apps/beta/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
